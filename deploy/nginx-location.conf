location = /recipebox {
    return 308 /recipebox/$is_args$args;
}
location ^~ /recipebox/ {
    # iOS may fetch home-screen artwork without the browser's device cookie.
    # Only these public branding files bypass authentication; never allow all assets.
    location ~ ^/recipebox/(?:favicon\.ico|recipebox\.svg|apple-touch-icon\.png)$ {
        auth_request off;
        limit_except GET { deny all; }
        rewrite ^/recipebox/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18083;
    }

    proxy_pass http://127.0.0.1:18083/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 26m;
    proxy_read_timeout 310s;
    proxy_send_timeout 130s;
    proxy_next_upstream off;
    proxy_redirect off;
}
